<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лабораторная работа №6</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Таблица студентов</h1>
    <p>Лабораторная работа №6 — вариант 8</p>

    <div class="row">
      <div>
        <label for="studentName">Имя</label>
        <input id="studentName" type="text" placeholder="Имя студента">
      </div>
      <div>
        <label for="score">Балл</label>
        <input id="score" type="number" min="0" max="100" placeholder="0–100">
      </div>
    </div>

    <button id="addBtn">Добавить студента</button>

    <div class="toolbar">
      <input id="search" type="text" placeholder="Поиск по имени">
      <button id="sortBtn" class="secondary">Сортировать по баллу</button>
    </div>

    <p id="message" class="error"></p>

    <table>
      <thead>
        <tr>
          <th>Имя</th>
          <th>Балл</th>
          <th>Действие</th>
        </tr>
      </thead>
      <tbody id="studentTable"></tbody>
    </table>
  </main>
  <script src="script.js"></script>
</body>
</html>
